{% extends 'base.html' %}

{% block body_class %}page-home{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-3 text-center">Assessment Routing System</h1>
                <p class="text-muted text-center mb-4">Choose your role to continue to the correct login page.</p>

                <div class="d-grid gap-3">
                    <a href="{% url 'student_login' %}" class="btn btn-primary btn-lg">Student Login</a>
                    <a href="{% url 'supervisor_login' %}" class="btn btn-outline-primary btn-lg">Supervisor Login</a>
                    <a href="{% url 'admin_login' %}" class="btn btn-dark btn-lg">Administrator Login</a>
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'register' %}">Need an account? Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
