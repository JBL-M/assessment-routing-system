{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="alert {% if success %}alert-success{% else %}alert-danger{% endif %} mb-4" role="alert">
                    <h4 class="alert-heading mb-2">{{ heading }}</h4>
                    <p class="mb-0">{{ message }}</p>
                </div>

                <a href="{{ action_url }}" class="btn btn-primary w-100">{{ action_text }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
