{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="text-center">
                    Login
                </h3>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>Email Address</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Role</label>

                        <select name="role" class="form-select" required>
                            <option value="" selected disabled>Select role</option>
                            <option value="student">Student</option>
                            <option value="admin">Administrator</option>
                            <option value="supervisor">Supervisor</option>
                        </select>

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Login

                    </button>
                    <a href="{% url 'register' %}"
                       class="btn btn-link w-100">

                        Don't have an account? Register
                    </a>

                </form>

                <hr>

                <h6 class="mt-3 mb-2">Need a new verification email?</h6>
                <form method="POST" action="{% url 'resend_verification' %}">
                    {% csrf_token %}
                    <div class="mb-2">
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                            class="form-control">
                    </div>
                    <button class="btn btn-outline-secondary w-100" type="submit">Resend Verification</button>
                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
