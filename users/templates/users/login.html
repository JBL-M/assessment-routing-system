{% extends 'base.html' %}

{% block body_class %}page-student-login{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="text-center">
                    {{ login_meta.title }}
                </h3>
                <p class="text-center text-muted mb-4">{{ login_meta.subtitle }}</p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>Email Address</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                            class="form-control">

                    </div>

                    <input type="hidden" name="role" value="{{ forced_role }}">

                    <button
                        class="btn btn-primary w-100">

                        Login

                    </button>
                    <a href="{% url 'register' %}"
                       class="btn btn-link w-100">

                        Don't have an account? Register
                    </a>
                    <a href="{% url 'home' %}" class="btn btn-link w-100">Back to Home</a>

                </form>

                <hr>

                <h6 class="mt-3 mb-2">Need a new verification email?</h6>
                <form method="POST" action="{% url 'resend_verification' %}">
                    {% csrf_token %}
                    <div class="mb-2">
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                            class="form-control">
                    </div>
                    <button class="btn btn-outline-secondary w-100" type="submit">Resend Verification</button>
                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
