<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <div class="admin-dashboard">
      <h2>Student Management</h2>
      <div class="card shadow-sm">
        <div class="card-header"><strong>Approval Queue</strong></div>
        <div class="card-body p-0">
          <table id="studentsQueueTable" class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Student</th>
                <th>Email</th>
                <th>Registration</th>
                <th>Course</th>
                <th>Organization</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7" class="text-center empty-state">No student applications submitted yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="mt-3">
        <a href="admin-dashboard.html" class="btn btn-outline-primary">Back to Dashboard</a>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="admin-students.js"></script>
</body>
</html>
